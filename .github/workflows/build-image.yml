name: Build and push one flavor image

on:
  workflow_call:
    inputs:
      flavor:
        description: Image path suffix under ghcr.io/<repo>/<flavor>
        required: true
        type: string
      containerfile:
        description: Path to the Containerfile for this flavor
        required: true
        type: string
      build_args:
        description: Optional build-args string passed to build-push-action
        required: false
        type: string
        default: ''
    outputs:
      short_sha:
        description: Short git SHA used for this build's sha-<...> tag
        value: ${{ jobs.build-and-push.outputs.short_sha }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in at GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ inputs.flavor }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.sha.outputs.short }}

      - name: Build and Push the OS Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.containerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}

          # Faster subsequent builds via GitHub's cache, scoped per flavor
          # so base/server/desktop don't clobber each other's cache entries.
          cache-from: type=gha,scope=${{ inputs.flavor }}
          cache-to: type=gha,mode=max,scope=${{ inputs.flavor }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}/${{ inputs.flavor }}@${DIGEST}"
